<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Customer History - Blink Bill</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
  <script src="utils.js"></script>
  <link rel="icon" href="logo195.png" type="image/png" />

</head>
<body>
  <script>
    if (!localStorage.getItem('bharat_logged_in')) { location.href = 'login.html'; }
  </script>
  <div id="bharatLoader">
  <div class="logo-container">
    <img src="logo195.png" alt="Blink Bill Logo" class="logo">
  </div>
  
  <h1>Blink Bill</h1>
  <p>Loading, please wait... 🚀</p>
</div>
  <div class="container">
    <h1>Customer History</h1>
    <input type="text" id="search" placeholder="Search by name or phone..." class="input" oninput="filter()" autofocus/>

    <div id="historyList" style="margin-top:20px;"></div>

    <button onclick="history.back()" class="btn-stock" style="margin-top:30px; padding:15px; width:100%;"><i class="fa-solid fa-arrow-left"></i> Back to Billing</button>
  </div>

  <script>
    let allBills = JSON.parse(localStorage.getItem("bharat_bills") || "[]");

    // Merge archived bills (2+ months, stored in IndexedDB) into the view
    if (window.ArchiveDB) {
      ArchiveDB.getAll().then(arc => {
        if (arc.length) {
          allBills = [...allBills, ...arc];
          showHistory(); // re-render with full history
        }
      });
    }

    function showHistory() {
      if (allBills.length === 0) {
        document.getElementById("historyList").innerHTML = "<p class='t-muted' style='text-align:center; padding:40px;'>No bills saved yet.</p>";
        return;
      }

      // Latest first
      const billsToShow = [...allBills].reverse();

      let html = "";
      billsToShow.forEach(b => {
        html += `
          <div class="stock-item" style="margin:12px 0; padding:18px; border-radius:18px;">
            <strong class="t-green" style="font-size:1.4rem;">${esc(b.name || "Walk-in Customer")}</strong>
            ${b.phone ? `<span class="t-green" style="margin-left:8px;">(${esc(b.phone)})</span>` : ""}
            <br><br>
            <small class="t-muted">
              ${b.date || "Date not saved"}<br>
                          <strong class="t-red" style="font-size:1.2rem;">₹${esc(b.total || "0.00")}</strong> • ${esc(b.itemsCount || "0")} items
            </small>
                        ${b.items ? `<br><small class="t-green">${(b.items || []).map(it => `${esc(it.name)} (${it.qty}×₹${it.price})`).join(' | ')}</small>` : (b.itemsList ? `<br><small class="t-green">${esc(b.itemsList)}</small>` : "")}
          </div>
        `;
      });

      document.getElementById("historyList").innerHTML = html;
    }

    function filter() {
      let q = document.getElementById("search").value.toLowerCase();
      let filtered = allBills.filter(b => 
        (b.name || "").toLowerCase().includes(q) || 
        (b.phone || "").includes(q)
      );

      document.getElementById("historyList").innerHTML = filtered.length ? filtered.map(b => `
        <div class="stock-item" style="margin:12px 0; padding:18px; border-radius:18px;">
          <strong class="t-green">${esc(b.name)}</strong> ${b.phone ? `(${esc(b.phone)})` : ""}
          <br><small class="t-muted">${b.date} • ₹${esc(b.total)} • ${esc(b.itemsCount)} items</small>
          ${b.itemsList ? `<br><small class="t-green">${esc(b.itemsList)}</small>` : ""}
        </div>
      `).join("") : "<p class='t-muted' style='text-align:center; padding:40px;'>No customer found.</p>";
    }

    showHistory();
  </script>
  <!-- LOADER JS -->
<script>
  window.addEventListener("load", () => {
    const loader = document.getElementById("bharatLoader");
    if (!loader) return;
    setTimeout(() => {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 1300);
    }, 1800);
  });

  setTimeout(() => {
    const loader = document.getElementById("bharatLoader");
    if (loader && loader.parentNode) {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 1000);
    }
  }, 6000);
</script>
</body>
</html>
