<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>QR/Barcode Generator - Blink Bill</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <script src="load-manager.js"></script>
  <script src="utils.js"></script>

</head>
<body>
  <script>
    if (!localStorage.getItem('bharat_logged_in')) { location.href = 'login.html'; }
  </script>
  <div id="bharatLoader">
  <div class="logo-container">
    <img src="favicon.jpeg" alt="Blink Bill Logo" class="logo">
  </div>
  
  <h1>Blink Bill</h1>
  <p>Loading, please wait... 🚀</p>
</div>
  <div class="container">
    <h1 class="page-title">Add Product & Generate Code</h1>

    <div class="add-form">
      <input type="text" id="pname" placeholder="Product Name *" class="input" required/>
      <input type="number" id="pstock" placeholder="Initial Stock *" class="input" min="0" required/>
      <input type="number" id="pprice" placeholder="Price ₹ *" class="input" min="0" step="0.01" required/>
      <input type="number" id="pgst" placeholder="GST %" class="input" min="0" max="100" value="0"/>
      <input type="text" id="pbarcode" placeholder="Barcode (optional - leave blank for auto)" class="input"/>
      
      <div class="code-type-selector">
        <label class="radio-label"><input type="radio" name="codeType" value="qr" checked> QR Code</label>
        <label class="radio-label"><input type="radio" name="codeType" value="barcode"> Barcode</label>
      </div>

      <button onclick="generateCode()" class="btn-green btn-large">
        🏷️ ADD PRODUCT & GENERATE CODE
      </button>
    </div>

    <div id="codeSection" class="code-section">
      <h3 id="codeTitle">Generated Code</h3>
      <div id="generatedCode" class="generated-code-container"></div>
      <div class="button-group">
        <button onclick="printCode()" class="btn-blue">🖨️ PRINT CODE</button>
        <button onclick="downloadCode()" class="btn-blue">⬇️ DOWNLOAD CODE</button>
      </div>
    </div>

    <button onclick="location.href='index.html'" class="btn-stock btn-large">
      Back to Billing
    </button>
  </div>

  <script src="qr-generator.js"></script>
  <!-- LOADER JS -->
<script>
  window.addEventListener("load", () => {
    const loader = document.getElementById("bharatLoader");
    if (!loader) return;
    setTimeout(() => {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 1300);
    }, 1800);
  });

  setTimeout(() => {
    const loader = document.getElementById("bharatLoader");
    if (loader && loader.parentNode) {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 1000);
    }
  }, 6000);
</script>
</body>
</html>
