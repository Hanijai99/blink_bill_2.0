<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="loader.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>UPI Payment - Blink Bill</title>
  <style>
    body { font-family:'Segoe UI',system-ui,sans-serif; text-align:center; padding:20px; min-height:100vh; }
    #qr-code-container { margin:30px auto; width:280px; height:280px; border:2px solid var(--green); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); background:#fff; }
    .upi-box { background:var(--card); border:1px solid var(--border); padding:15px; border-radius:20px; box-shadow:var(--shadow); max-width:400px; margin:20px auto; transition:background-color .3s; }
    .pay-btn {
      margin-top:20px; background:linear-gradient(135deg,#16a34a,#15803d); color:#fff;
      border:none; padding:17px 38px; border-radius:50px; font-size:1.12rem;
      font-weight:bold; cursor:pointer; box-shadow:0 8px 20px rgba(22,163,74,.4), inset 0 1px 0 rgba(255,255,255,.2);
      letter-spacing:.5px; transition:transform .15s, filter .2s;
    }
    .pay-btn:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .pay-btn:active { transform:scale(.97); }
  </style>
  <script src="load-manager.js"></script>
</head>
<body>
  <script>if (localStorage.getItem('dark') === 'true') document.body.classList.add('dark');</script>

  <h1>Scan & Pay</h1>

  <div class="upi-box">
    <div id="qr-code-container"></div>

    <div class="info">
      <strong>₹<span id="amount">0.00</span></strong><br>
      <p>UPI ID: <span id="upiId">yourupi@upi</span></p>
      <p>Name: <span id="upiName">Blink Store</span></p>
      <p>Bank: <span id="bankName">Default</span></p>
    </div>
  </div>

  <p id="switchLink" style="margin-top:10px;">
    <a href="upi_manage.html" class="t-green" style="font-weight:bold;">Change payment account</a>
  </p>

  <!-- Owner taps this after confirming money arrived → bill auto-prints in the app -->
  <button id="payReceivedBtn" class="pay-btn"><i class="fa-solid fa-circle-check"></i> PAYMENT RECEIVED</button>

  <script>
    // URL-la irundhu amount eduthuko
    const urlParams = new URLSearchParams(window.location.search);
    const amt = urlParams.get('amt') || '0.00';
    document.getElementById('amount').innerText = amt;

    // Active bank account eduthuko (shop owner upi_manage.html-la set panniruppanga)
    const banks = JSON.parse(localStorage.getItem("upiBanks") || "[]");
    let activeIndex = parseInt(localStorage.getItem("activeUpiIndex"), 10);
    if (isNaN(activeIndex) || activeIndex < 0 || activeIndex >= banks.length) {
      activeIndex = banks.length > 0 ? 0 : -1;
    }
    const activeBank = activeIndex >= 0 ? banks[activeIndex] : null;

    // Fallback to old single shop-level UPI ID if no bank added yet
    const shop = JSON.parse(localStorage.getItem("bharat_shop_details") || "{}");

    const upiId = activeBank ? activeBank.upiId : (shop.upiId || "yourupi@upi");
    const upiName = activeBank ? activeBank.ownerName : (shop.shopName || "Blink Store");
    const bankLabel = activeBank ? activeBank.bankName : "Not set — add a bank in UPI MANAGE";

    document.getElementById('upiId').innerText = upiId;
    document.getElementById('upiName').innerText = upiName;
    document.getElementById('bankName').innerText = bankLabel;

    if (!activeBank) {
      alert("No UPI bank account is set. Please add and activate one in UPI MANAGE.");
    }

    // Dynamic UPI link — always uses whichever bank is currently active
    const upiLink = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(upiName)}&am=${amt}&cu=INR&tn=Bill Payment`;

    // QR code generate — prefer the bank's own uploaded QR image if available,
    // otherwise lazy-load the QR library and generate a live QR from the UPI deep link.
    if (activeBank && activeBank.qrImage) {
      const img = document.createElement('img');
      img.src = activeBank.qrImage;
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'contain';
      document.getElementById('qr-code-container').appendChild(img);
    } else {
      LoadManager.loadQR().then(() => {
        new QRCode(document.getElementById("qr-code-container"), {
          text: upiLink,
          width: 280,
          height: 280,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }).catch(() => {
        document.getElementById("qr-code-container").innerHTML =
          '<p style="padding:20px;text-align:center;color:#c0392b">QR load failed. Check internet — or pay manually to<br><b>' + upiId + '</b></p>';
      });
    }

    // PAYMENT RECEIVED — when embedded in index.html, tell the parent app to
    // close the modal and auto-open the print page. Standalone: jump straight
    // back to billing and auto-print (cart restored from session backup).
    document.getElementById('payReceivedBtn').addEventListener('click', () => {
      try {
        if (window.parent && window.parent !== window && typeof window.parent.onPaymentReceived === 'function') {
          window.parent.onPaymentReceived();
          return;
        }
      } catch (e) { /* fall through to standalone mode */ }
      location.href = 'index.html?restoreprint=1';
    });
  </script>

</body>
</html>
