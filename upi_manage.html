<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Manage UPI - Blink Bill</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <script src="utils.js"></script>
  <style>
    .manage-container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .bank-list { margin: 20px 0; }
    .bank-item { padding: 14px; border: 1px solid var(--border); margin-bottom: 10px; border-radius: 14px; position: relative; background: var(--card); box-shadow: var(--shadow); transition: background-color .3s, border-color .3s; }
    .bank-item.active { border: 2px solid #16a34a; background: var(--surface-2); }
    body.dark .bank-item { background: #0f172a; }
    body.dark .bank-item.active { background: #052e16; border-color: #16a34a; }
    .bank-item .active-badge { display:inline-block; background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:20px; margin-bottom:6px; }
    .bank-item .btn-row { margin-top: 10px; display:flex; gap:8px; }
    .bank-item button { border: none; padding: 8px 14px; border-radius: 10px; font-weight:bold; cursor:pointer; }
    .bank-item .set-active-btn { background:linear-gradient(135deg,#16a34a,#15803d); color:white; }
    .bank-item .set-active-btn:disabled { background:var(--border-strong); cursor:default; color:#fff; }
    .bank-item .delete-btn { background:linear-gradient(135deg,#ef4444,#b91c1c); color:white; }
    #addForm { margin-top: 20px; }
    input { margin-bottom: 10px; width: 100%; padding: 12px; box-sizing: border-box; border:1.5px solid var(--border); border-radius:12px; background:var(--surface); color:var(--text); transition:border-color .2s, box-shadow .2s; }
    input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 4px var(--ring); }
    body.dark .bank-item .set-active-btn { background:linear-gradient(135deg,#22c55e,#16a34a); }
    body.dark .bank-item .delete-btn { background:linear-gradient(135deg,#ef4444,#b91c1c); }
  </style>
   <!-- ⭐ YEVALO IMPORTANT - IDHU 5 LINE FULL PROJECT KU WORK AAGUM ⭐ -->
  <link rel="icon" href="favicon.jpeg" type="image/png" />
  <link rel="shortcut icon" href="favicon.jpeg" type="image/png" />
  <link rel="apple-touch-icon" href="logo192.png" />
  <link rel="manifest" href="manifest.json" />

</head>
<body>
  <script>
    if (!localStorage.getItem('bharat_logged_in')) { location.href = 'login.html'; }
  </script>
  <div id="bharatLoader">
  <div class="logo-container">
    <img src="favicon.jpeg" alt="Blink Bill Logo" class="logo">
  </div>
  
  <h1>Blink Bill</h1>
  <p>Loading, please wait... 🚀</p>
</div>
  <div class="manage-container">
    <h1>Manage UPI Banks</h1>
    <p>Add banks and choose which one customers should pay to. Change it anytime.</p>

    <div id="activeSummary" class="stat-panel" style="margin:15px 0; font-weight:bold; color:var(--green-dark); text-align:center;"></div>

    <div class="bank-list" id="bankList"></div>
    
    <div id="addForm">
      <input type="text" id="bankName" placeholder="Bank Name (e.g., SBI)" />
      <input type="text" id="upiId" placeholder="UPI ID (e.g., yourname@oksbi)" />
      <input type="text" id="ownerName" placeholder="Owner Name (e.g., Blink Store)" />
      <input type="file" id="qrFile" accept="image/*" />
      <button onclick="addBank()" class="btn-green">🏦 Add Bank</button>
    </div>
    
    <button onclick="window.location.href='index.html'" class="btn-green" style="margin-top:20px; width:100%;">
  🧾 Back to Billing
</button>
</div>

  <script>
    let banks = JSON.parse(localStorage.getItem("upiBanks")) || [];
    // activeUpiIndex = index of the bank that customers should currently pay to.
    // Stored separately so index survives renders; validated against banks.length below.
    let activeIndex = parseInt(localStorage.getItem("activeUpiIndex"), 10);
    if (isNaN(activeIndex) || activeIndex < 0 || activeIndex >= banks.length) {
      activeIndex = banks.length > 0 ? 0 : -1;
      persistActiveIndex();
    }

    function persistActiveIndex() {
      localStorage.setItem("activeUpiIndex", activeIndex);
    }

    function renderBanks() {
      let html = "";
      banks.forEach((bank, i) => {
        const isActive = i === activeIndex;
        html += `<div class="bank-item ${isActive ? 'active' : ''}">
          ${isActive ? '<span class="active-badge">✓ ACTIVE — Customers pay here</span><br>' : ''}
          <strong>${esc(bank.bankName)}</strong><br>
          UPI: ${esc(bank.upiId)}<br>
          Name: ${esc(bank.ownerName)}<br>
          QR: ${bank.qrImage ? 'Set' : 'Not Set'}
          <div class="btn-row">
            <button class="set-active-btn" onclick="setActiveBank(${i})" ${isActive ? 'disabled' : ''}>
              ${isActive ? '✔️ Active' : '✔️ Set Active'}
            </button>
            <button class="delete-btn" onclick="deleteBank(${i})">🗑️ Delete</button>
          </div>
        </div>`;
      });
      document.getElementById("bankList").innerHTML = html || "<p>No banks added yet.</p>";

      const summaryEl = document.getElementById("activeSummary");
      if (activeIndex >= 0 && banks[activeIndex]) {
        const b = banks[activeIndex];
        summaryEl.innerText = `Customers currently pay to: ${b.bankName} (${b.upiId})`;
      } else {
        summaryEl.innerText = "No active bank selected yet — add a bank and set it active.";
      }
    }

    function setActiveBank(index) {
      activeIndex = index;
      persistActiveIndex();
      renderBanks();
    }

    function addBank() {
      let bankName = document.getElementById("bankName").value.trim();
      let upiId = document.getElementById("upiId").value.trim();
      let ownerName = document.getElementById("ownerName").value.trim();
      let qrFile = document.getElementById("qrFile").files[0];
      
      if (!bankName || !upiId || !ownerName) {
        alert("Please complete all bank details before saving.");
        return;
      }
      
      let bank = { bankName, upiId, ownerName, qrImage: null };
      
      if (qrFile) {
        let reader = new FileReader();
        reader.onload = () => {
          bank.qrImage = reader.result;
          saveAndRender(bank);
        };
        reader.readAsDataURL(qrFile);
      } else {
        saveAndRender(bank);
      }
    }
    
    function saveAndRender(bank) {
      banks.push(bank);
      localStorage.setItem("upiBanks", JSON.stringify(banks));
      // First bank added automatically becomes active so UPI PAY works immediately.
      if (activeIndex === -1) {
        activeIndex = banks.length - 1;
        persistActiveIndex();
      }
      renderBanks();
      clearForm();
    }
    
    function clearForm() {
      document.getElementById("bankName").value = "";
      document.getElementById("upiId").value = "";
      document.getElementById("ownerName").value = "";
      document.getElementById("qrFile").value = "";
    }
    
    function deleteBank(index) {
      if (confirm("Delete this bank?")) {
        banks.splice(index, 1);
        localStorage.setItem("upiBanks", JSON.stringify(banks));

        // Fix up activeIndex after deletion
        if (banks.length === 0) {
          activeIndex = -1;
        } else if (index === activeIndex) {
          activeIndex = 0; // deleted the active one → fall back to first bank
        } else if (index < activeIndex) {
          activeIndex -= 1; // shift left since an earlier item was removed
        }
        persistActiveIndex();
        renderBanks();
      }
    }
    
    renderBanks();
  </script>
  <!-- LOADER JS -->
<script>
  window.addEventListener("load", () => {
    const loader = document.getElementById("bharatLoader");
    if (!loader) return;
    setTimeout(() => {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 1300);
    }, 1800);
  });

  setTimeout(() => {
    const loader = document.getElementById("bharatLoader");
    if (loader && loader.parentNode) {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 1000);
    }
  }, 6000);
</script>
</body>
</html>
