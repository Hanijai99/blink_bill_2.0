<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Expenses - Blink Bill</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="utils.js"></script>

</head>
<body>
  <script>
    if (!localStorage.getItem('bharat_logged_in')) { location.href = 'login.html'; }
  </script>
  <div id="bharatLoader">
  <div class="logo-container">
    <img src="logo195.png" alt="Blink Bill Logo" class="logo">
  </div>
  
  <h1>Blink Bill</h1>
  <p>Loading, please wait... 🚀</p>
</div>
  <div class="container">
    <div class="header">
      <h1>Daily Expenses 💸</h1>
      <button onclick="location.href='index.html'" class="btn-blue"><i class="fa-solid fa-arrow-left"></i> Back to Billing</button>
    </div>

    <div class="add-section" style="max-width:600px; margin:40px auto;">
      <input type="date" id="expDate" class="input" value="" />
      <input type="text" id="expDesc" placeholder="Description (e.g., Electricity, Rent)" class="input"/>
      <input type="number" id="expAmt" placeholder="Amount ₹" class="input" step="0.01"/>
      <button onclick="addExpense()" class="btn-green" style="width:100%; padding:15px; margin-top:20px;"><i class="fa-solid fa-plus"></i> ADD EXPENSE</button>

      <div id="expList" style="margin-top:30px;"></div>

      <div class="stat-panel" style="margin-top:30px; text-align:center;">
        <p><strong>Today Total Expense:</strong> ₹<span id="todayTotal">0.00</span></p>
      </div>
    </div>
  </div>

  <script>
    let expenses = JSON.parse(localStorage.getItem("bharat_expenses") || "[]");

    function addExpense() {
      const date = document.getElementById("expDate").value || new Date().toISOString().slice(0,10);
      const desc = document.getElementById("expDesc").value.trim();
      const amt = parseFloat(document.getElementById("expAmt").value) || 0;

      if (!desc || amt <= 0) return alert("Description and Amount are mandatory.");

      expenses.push({date, desc, amt});
      localStorage.setItem("bharat_expenses", JSON.stringify(expenses));

      document.getElementById("expDesc").value = "";
      document.getElementById("expAmt").value = "";
      loadExpenses();
    }

    function loadExpenses() {
      const today = new Date().toISOString().slice(0,10);
      const todayExp = expenses.filter(e => e.date === today);
      let total = todayExp.reduce((s, e) => s + e.amt, 0);

      let html = "<h3>Today's Expenses</h3><ul style='list-style:none; padding:0;'>";
      todayExp.forEach((e, i) => {
        html += `<li style="padding:10px; border-bottom:1px solid #ddd;">
          ${esc(e.desc)} - ₹${e.amt.toFixed(2)}
          <button onclick="deleteExpense(${i})" style="float:right; background:var(--red); color:white; border:none; padding:5px 10px; border-radius:8px;"><i class="fa-solid fa-trash"></i> Delete</button>
        </li>`;
      });
      html += "</ul>";
      document.getElementById("expList").innerHTML = html || "<p>No expenses today!</p>";
      document.getElementById("todayTotal").innerText = total.toFixed(2);
    }

    function deleteExpense(index) {
      const today = new Date().toISOString().slice(0,10);
      let count = 0;
      expenses = expenses.filter(e => {
        if (e.date === today) {
          if (count === index) return false;
          count++;
        }
        return true;
      });
      localStorage.setItem("bharat_expenses", JSON.stringify(expenses));
      loadExpenses();
    }

    window.onload = () => {
      document.getElementById("expDate").value = new Date().toISOString().slice(0,10);
      loadExpenses();
    };
  </script>
  <!-- LOADER JS -->
<script>
  window.addEventListener("load", () => {
    const loader = document.getElementById("bharatLoader");
    if (!loader) return;
    setTimeout(() => {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 1300);
    }, 1800);
  });

  setTimeout(() => {
    const loader = document.getElementById("bharatLoader");
    if (loader && loader.parentNode) {
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 1000);
    }
  }, 6000);
</script>
</body>
</html>
