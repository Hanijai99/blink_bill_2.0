<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blink Bill — Offline</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <style>
    .offline-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      transition: background-color .35s, border-color .35s;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg,#ff9800,#f57c00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }
    .offline-card h1 {
      font-size: 1.6rem;
      color: var(--green-deep);
      margin-bottom: 10px;
    }
    .offline-card p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      background: linear-gradient(135deg,#006400,#009900);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .offline-note {
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <script>if (localStorage.getItem('dark') === 'true') document.body.classList.add('dark');</script>
  <div class="offline-wrap">
    <div class="offline-card">
      <div class="offline-icon">📶</div>
      <h1>You're Offline</h1>
      <p>No internet connection right now. Bills you create will be saved on this device and synced automatically once you're back online.</p>
      <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
      <div class="offline-note">Blink Bill</div>
    </div>
  </div>
</body>
</html>
