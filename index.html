<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>BLINK BILL</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
  <link rel="icon" href="logo195.png" type="image/png" />
  <link rel="shortcut icon" href="logo195.png" />
  <link rel="apple-touch-icon" href="logo195.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- LOAD MANAGER: heavy libraries (scanner/chart/pdf) load on demand -->
  <script src="load-manager.js"></script>
  <script src="utils.js"></script>
  <script src="store-scope.js"></script>

  
</head>
<body>
  <script>
    // Basic client-side protection: redirect to login if not authenticated
    if (!localStorage.getItem('bharat_logged_in')) {
      location.href = 'login.html';
    }
  </script>

  <!-- UPDATED LOADER with LOGO -->
  <div id="bharatLoader">
    <div class="logo-container">
      <div class="ring"></div>
      <img src="logo195.png" alt="BLINK BILL Logo" class="logo">
    </div>
    
    <h1>BLINK BILL</h1>
    <p>Loading, please wait a moment... 🚀</p>
  </div>

  <div class="container">
    <div class="header">
      <h1>BLINK BILL</h1>
      <button id="modeBtn" onclick="toggleMode()" class="btn-main btn-purple"><i class="fa-solid fa-moon"></i><span>Dark Mode</span></button>
      <button onclick="location.href='stores.html'" class="btn-main btn-teal" style="width:auto;" title="Switch store"><i class="fa-solid fa-store"></i><span id="storeBadge">Store</span></button>
      <button onclick="logout()" class="btn-main btn-red"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </div>

    <script>try{var sb=document.getElementById('storeBadge');if(sb&&(window.StoreScope||typeof StoreScope!=='undefined'))sb.textContent=StoreScope.activeStore().name;}catch(e){}</script>

    <div class="info">Logged in as: <strong id="owner">Owner</strong></div>

    <input type="text" id="cname" placeholder="Customer Name" class="input"/>
    <input type="tel" id="cphone" placeholder="Phone (optional)" class="input"/>

    <div class="discount">
      <input type="number" id="discAmt" placeholder="Discount ₹" class="input" oninput="calc()"/>
      <input type="number" id="discPer" placeholder="Discount %" class="input" oninput="calc()"/>
    </div>

    <div id="stockStatus" style="margin:20px 0; padding:18px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:20px; text-align:center; font-weight:bold; font-size:1.2rem; color:var(--green-dark);">
      Checking stock...
    </div>

    <div class="add-section">
      <h2>Add Item</h2>
      <input type="text" id="search" placeholder="Type product name..." class="input" oninput="showSuggest()" autofocus/>
      <div id="suggest" class="suggestions"></div>

      <div class="grid">
        <input type="text" id="name" placeholder="Item Name" class="input"/>
        <input type="number" id="qty" value="1" class="input"/>
        <input type="number" id="price" placeholder="Price" step="0.01" class="input"/>
        <input type="number" id="gst" placeholder="GST%" class="input" readonly/>
      </div>
      <button onclick="add()" class="btn-main btn-green" style="width:100%; margin-top:12px;"><i class="fa-solid fa-plus"></i><span>Add Item</span></button>
    </div>

    <!-- SCAN BUTTON -->
    <div style="text-align:center; margin:40px 0;">
      <button onclick="startScanner()" class="btn-main btn-blue" style="border-radius:18px;">
        <i class="fa-solid fa-barcode"></i><span>TAP TO SCAN ITEMS</span>
      </button>
    </div>

    <!-- UPI PAY MODAL (instant, inside the app — no page reload) -->
    <div id="upiModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:99998; align-items:center; justify-content:center;">
      <div style="position:relative; width:min(380px,92vw); max-height:94vh; overflow:auto; background:#fff; border-radius:22px; padding:26px 22px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.45);">
        <button onclick="closeUpiModal(false)" class="btn-main btn-slate" style="position:absolute; top:12px; right:12px; flex-direction:row; padding:8px 14px; font-size:.82rem; min-height:36px; width:auto;">
          <i class="fa-solid fa-xmark"></i><span>CLOSE</span>
        </button>
        <h2 style="color:#14532d; margin:4px 0 2px;"><i class="fa-solid fa-credit-card"></i> Scan &amp; Pay</h2>
        <div id="upiAmt" style="font-size:2.6rem; font-weight:900; color:#16a34a; margin:6px 0;">₹0.00</div>
        <div id="upiQrBox" style="display:flex; align-items:center; justify-content:center; min-height:240px; margin:10px auto;"></div>
        <div id="upiBankInfo" style="font-size:.9rem; color:#475569; margin-bottom:14px;"></div>
        <button onclick="onPaymentReceived()" class="btn-green" style="width:100%;">
          <i class="fa-solid fa-circle-check"></i> PAYMENT RECEIVED &amp; PRINT BILL
        </button>
      </div>
    </div>

    <!-- SCANNER MODAL -->
    <div id="scannerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:99999;">
      <div style="position:relative; width:100%; height:100%;">
        <div id="scanner-reader" style="width:100%; height:100%;"></div>
        
        <button onclick="stopScanner()" class="btn-main btn-slate" style="position:absolute; top:15px; right:15px; z-index:100; flex-direction:row; min-height:36px; width:auto; padding:8px 14px;">
          <i class="fa-solid fa-xmark"></i><span>CLOSE</span>
        </button>
        
        <div style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); color:white; font-size:1.3rem; background:rgba(0,0,0,0.7); padding:10px 20px; border-radius:15px;">
          Place barcode inside the frame
        </div>
      </div>
    </div>

    <div id="list"></div>

    <div class="total">
      <p>Subtotal: ₹<span id="sub">0.00</span></p>
      <p>Discount: ₹<span id="disc">0.00</span></p>
      <p>GST: ₹<span id="gstt">0.00</span></p>
      <p class="big">Final: ₹<span id="final">0.00</span></p>
    </div>

    <!-- OWNER BUTTONS -->
    <div class="buttons">
      <button onclick="location.href='ai-assistant.html'" class="btn-main btn-ai"><i class="fa-solid fa-robot"></i><span>AI ASSISTANT</span></button>
      <button onclick="location.href='stores.html'" class="btn-main btn-pink"><i class="fa-solid fa-store"></i><span>MANAGE STORES</span></button>
      <button onclick="print()" class="btn-main btn-slate"><i class="fa-solid fa-print"></i><span>PRINT</span></button>
      <button onclick="upi()" class="btn-main btn-upi"><i class="fa-solid fa-credit-card"></i><span>UPI PAY</span></button>
      <button onclick="save()" class="btn-main btn-green"><i class="fa-solid fa-floppy-disk"></i><span>SAVE BILL</span></button>
      <button onclick="wa()" class="btn-main btn-wa"><i class="fa-brands fa-whatsapp"></i><span>WHATSAPP</span></button>
      <button onclick="uploadQR()" class="btn-main btn-teal"><i class="fa-solid fa-qrcode"></i><span>SET UPI QR</span></button>
      <button onclick="location.href='stock.html'" class="btn-main btn-accent"><i class="fa-solid fa-boxes-stacked"></i><span>MANAGE STOCK</span></button>
      <button onclick="location.href='qr-generation.html'" class="btn-main btn-orange"><i class="fa-solid fa-tag"></i><span>ADD PRODUCT & QR</span></button>
      <button onclick="location.href='upi_manage.html'" class="btn-main btn-upi-manage"><i class="fa-solid fa-building-columns"></i><span>UPI MANAGE</span></button>
      <button onclick="location.href='history.html'" class="btn-main btn-sky"><i class="fa-solid fa-users"></i><span>CUSTOMER HISTORY</span></button>
      <button onclick="showTodayStats()" class="btn-main btn-rose"><i class="fa-solid fa-chart-pie"></i><span>TODAY STATS</span></button>
      <button onclick="location.href='dashboard.html'" class="btn-main btn-blue"><i class="fa-solid fa-chart-line"></i><span>DASHBOARD</span></button>
      <button onclick="exportData()" class="btn-main btn-emerald"><i class="fa-solid fa-file-excel"></i><span>BACKUP EXCEL</span></button>
      <button onclick="importData()" class="btn-main btn-charcoal"><i class="fa-solid fa-file-import"></i><span>RESTORE DATA</span></button>
      <button onclick="location.href='bill-settings.html'" class="btn-main btn-cyan"><i class="fa-solid fa-gear"></i><span>SHOP SETTINGS</span></button>
      <button onclick="dailyClose()" class="btn-main btn-maroon"><i class="fa-solid fa-lock"></i><span>CLOSE DAY</span></button>
      <button onclick="location.href='expenses.html'" class="btn-main btn-lime"><i class="fa-solid fa-money-bill-wave"></i><span>EXPENSES</span></button>
    </div>
    <a href="privacy-policy.html" style="display:block; text-align:center; margin:14px 0 4px; color:#64748b; font-size:.9rem;">📜 Privacy Policy</a>
  </div>

  <!-- LOADER JS -->
  <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("bharatLoader");
      if (!loader) return;
      setTimeout(() => {
        loader.style.opacity = "0";
        setTimeout(() => {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 1300);
      }, 1800);
    });

    setTimeout(() => {
      const loader = document.getElementById("bharatLoader");
      if (loader && loader.parentNode) {
        loader.style.opacity = "0";
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 1000);
      }
    }, 6000);
  </script>

  <!-- Scanner script -->
  <script>
    let html5QrCode = null;
    let scanLock = false;
    let decodeMisses = 0;
    let switchedToNative = false;
    let scannedOnce = false;

    function showScanHint(msg, isErr) { try { showToast(msg, !!isErr); } catch (e) {} }

    async function startScanner() {
      try { unlockAudio(); } catch (e) {}

      const modal = document.getElementById('scannerModal');
      const reader = document.getElementById('scanner-reader');
      if (!modal || !reader) { showScanHint('❌ Scanner UI missing — reload the page', true); return; }
      modal.style.display = 'block';

      // Load scanner library on demand (Load Manager)
      try {
        await LoadManager.loadScanner();
      } catch (e) {
        showScanHint('❌ Scanner library load failed — check internet', true);
        stopScanner();
        return;
      }
      if (!window.Html5Qrcode || !window.Html5QrcodeSupportedFormats) {
        alert("Scanner engine failed to load. Please reload the page and retry.");
        stopScanner();
        return;
      }

      // Camera support preflight (clear message instead of a silent failure)
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Camera not supported on this browser.\n\nPlease use Chrome (Android) or Safari (iPhone).");
        stopScanner();
        return;
      }

      // Clean up any previous instance/DOM leftovers before starting fresh
      if (html5QrCode) {
        try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {}
        html5QrCode = null;
      }
      reader.innerHTML = "";

      // Limit decoding to the formats we use. If the built-in engine can't
      // lock onto anything after a few seconds, we auto-switch to the
      // browser's native BarcodeDetector (more reliable for 1D barcodes on
      // Chrome) instead of giving up silently (see onScanFailure below).
      const fmt = window.Html5QrcodeSupportedFormats;
      const useNative = !!switchedToNative;
      const ctorConfig = fmt ? {
        formatsToSupport: [
          fmt.QR_CODE, fmt.EAN_13, fmt.EAN_8,
          fmt.UPC_A, fmt.UPC_E, fmt.CODE_128, fmt.CODE_39
        ],
        useBarCodeDetectorIfSupported: useNative
      } : { useBarCodeDetectorIfSupported: useNative };

      try {
        html5QrCode = new Html5Qrcode("scanner-reader", ctorConfig);
      } catch (e) {
        console.error("scanner init failed", e);
        alert("Scanner failed to start: " + e.message);
        stopScanner();
        return;
      }

      const config = { fps: 10, qrbox: { width: 250, height: 160 } };

      const onScanSuccess = (decodedText) => {
        if (scanLock) return;   // prevent duplicate scans of same code
        scanLock = true;
        scannedOnce = true;
        decodeMisses = 0;

        const barcode = decodedText.trim();
        const product = items.find(i => i.barcode === barcode);

        if (!product) {
          showToast("❌ Product not found! Barcode: " + barcode, true);
        } else {
          document.getElementById("name").value = product.name;
          document.getElementById("price").value = product.price;
          document.getElementById("gst").value = product.gst;
          document.getElementById("qty").value = 1;
          add();  // Auto add to cart
          showToast(`✅ Added: ${product.name}`);
        }

        if (navigator.vibrate) navigator.vibrate(120);
        playBeep();

        stopScanner();
        setTimeout(() => { scanLock = false; }, 800);
      };

      // Per-frame decode misses: camera running but nothing recognised.
      const onScanFailure = () => {
        if (scanLock || !html5QrCode) return;
        decodeMisses++;
        // ~9s of no detection with the built-in engine -> switch to native detector
        if (!switchedToNative && !scannedOnce && decodeMisses > 90) {
          switchedToNative = true;
          showScanHint('⚡ Switching to fast scan mode…');
          restartScanner();
        } else if (switchedToNative && !scannedOnce && decodeMisses > 240) {
          showScanHint('💡 Point the camera straight at the barcode, hold steady & keep it well lit', true);
          decodeMisses = 0;
        }
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          onScanFailure
        );
      } catch (err) {
        console.error("camera start failed", err);
        const msg = err && err.message ? err.message : err;
        const low = String(msg).toLowerCase();
        const denied = low.indexOf("denied") !== -1 || low.indexOf("notallowed") !== -1 || low.indexOf("permission") !== -1;
        if (denied) {
          alert("Camera permission denied!\n\nTap the lock/camera icon next to the address bar (Site settings) -> Camera -> Allow, then retry.");
        } else if (navigator.mediaDevices) {
          navigator.mediaDevices.getUserMedia({ video: true }).then(() => {
            alert("Camera error: " + msg + "\n\nPlease close other camera apps and retry.");
          }).catch(() => {
            alert("Camera permission denied!\n\nAllow camera access for this site in browser settings, then retry.");
          });
        } else {
          alert("Camera not available: " + msg);
        }
        stopScanner();
      }
    }

    async function restartScanner() {
      const old = html5QrCode;
      html5QrCode = null;
      if (old) { try { await old.stop(); old.clear(); } catch (e) {} }
      decodeMisses = 0;
      try { await startScanner(); } catch (e) { console.error("scanner restart failed", e); }
    }

    async function stopScanner() {
      if (html5QrCode) {
        try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {}
        html5QrCode = null;
      }
      scanLock = false;
      decodeMisses = 0;
      const modal = document.getElementById('scannerModal');
      if (modal) modal.style.display = 'none';
    }
  </script>

  <script src="script.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker registered', reg))
        .catch((err) => console.log('Service Worker registration failed', err));
    });
  }
</script>
</body>
</html>
